; PHP-Einstellungen für f-b-v
;
; Diese Datei wirkt bei PHP als FastCGI/FPM – so betreibt Plesk PHP im
; Normalfall. Läuft PHP als Apache-Modul, greift stattdessen der Block in
; .htaccess. Änderungen werden erst nach bis zu 5 Minuten wirksam
; (user_ini.cache_ttl), oder sofort nach einem Neustart von PHP-FPM.

; Handyfotos liegen heute bei 3–8 MB. 25 MB lassen auch Rohaufnahmen durch.
upload_max_filesize = 25M

; Muss größer sein als upload_max_filesize, weil mehrere Bilder auf einmal
; hochgeladen werden können.
post_max_size = 150M
max_file_uploads = 30

; GD braucht rund 4 Byte je Bildpunkt: ein 24-Megapixel-Foto belegt beim
; Verkleinern etwa 100 MB, ein 48-Megapixel-Foto das Doppelte.
memory_limit = 256M

; Genug Luft für langsame Mobilfunk-Uploads.
max_execution_time = 300
max_input_time = 300

; Sonde: Dieser Wert ist absichtlich ungewöhnlich und wird von Hostern nie
; gesperrt. Zeigt die Verwaltung unter "Serverumgebung" den Wert 1234, dann
; liest der Server diese Datei tatsächlich ein – und ein trotzdem zu niedriges
; Upload-Limit ist bewusst vom Hoster festgezurrt. Bleibt der Wert bei 1000,
; wird die Datei gar nicht gelesen.
max_input_vars = 1234
